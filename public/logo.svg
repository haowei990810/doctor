<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="20" y1="8" x2="108" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fe0c0"/>
      <stop offset="0.55" stop-color="#3fbfa3"/>
      <stop offset="1" stop-color="#2fa7b0"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="40" y1="40" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8fbf4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2fa7b0" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Shield body -->
  <path filter="url(#softShadow)" d="M64 10 L104 24 C104 24 106 66 96 88 C87 107 64 118 64 118 C64 118 41 107 32 88 C22 66 24 24 24 24 Z" fill="url(#shieldGrad)"/>
  <path d="M64 10 L104 24 C104 24 106 66 96 88 C87 107 64 118 64 118 C64 118 41 107 32 88 C22 66 24 24 24 24 Z" fill="url(#shieldGrad)"/>

  <!-- inner glossy highlight -->
  <path d="M64 18 L97 29 C97 29 98 63 90 82 C83 97 64 107 64 107 Z" fill="#ffffff" opacity="0.12"/>

  <!-- Magnifier lens (self-check) -->
  <circle cx="60" cy="58" r="24" fill="url(#lensGrad)"/>
  <circle cx="60" cy="58" r="24" stroke="#ffffff" stroke-width="3" opacity="0.85"/>

  <!-- Tick (mite) silhouette inside lens -->
  <g fill="#2fa196">
    <ellipse cx="60" cy="60" rx="9" ry="11"/>
    <circle cx="60" cy="47" r="4.2"/>
    <!-- legs left -->
    <path d="M51 54 C46 51 43 51 39 52" stroke="#2fa196" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M51 60 C45 59 42 60 38 62" stroke="#2fa196" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M52 66 C47 67 44 69 41 72" stroke="#2fa196" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <!-- legs right -->
    <path d="M69 54 C74 51 77 51 81 52" stroke="#2fa196" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M69 60 C75 59 78 60 82 62" stroke="#2fa196" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M68 66 C73 67 76 69 79 72" stroke="#2fa196" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Magnifier handle -->
  <rect x="78" y="76" width="10" height="24" rx="5" transform="rotate(-45 83 88)" fill="#ffffff"/>
  <rect x="79.5" y="77.5" width="7" height="21" rx="3.5" transform="rotate(-45 83 88)" fill="#eafaf4"/>

  <!-- check mark badge -->
  <circle cx="92" cy="40" r="13" fill="#ffffff"/>
  <circle cx="92" cy="40" r="13" fill="#ffffff"/>
  <path d="M86 40.5 L90.5 45 L98.5 35.5" stroke="#3fbfa3" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
